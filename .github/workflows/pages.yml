name: Test and publish GT Parking
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gt-parking-publish
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run application tests
        run: npm test
      - name: Verify shared backend and browser CORS
        run: npm run test:backend
      - name: Publish tested main to gh-pages
        run: git push origin HEAD:gh-pages
