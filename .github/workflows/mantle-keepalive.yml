name: Keep parking shared state active
on:
  schedule:
    - cron: '17 5 */14 * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read live Mantle configuration
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { APP_CONFIG } from './config.js';
          fs.appendFileSync(process.env.GITHUB_ENV, `MANTLE_BASE=${APP_CONFIG.mantleBaseUrl}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `MANTLE_NAMESPACE=${APP_CONFIG.mantleNamespace}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `MANTLE_KEY=${APP_CONFIG.mantleKey}\n`);
          NODE
      - name: Refresh active MantleDB namespace activity
        shell: bash
        run: |
          curl --fail --silent --show-error \
            -X POST "$MANTLE_BASE/$MANTLE_NAMESPACE/meta" \
            -H 'Content-Type: application/json' \
            -H "X-Mantle-Key: $MANTLE_KEY" \
            --data "{\"application\":\"GT Parking\",\"keepalive\":true,\"updatedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"
